[project]
name = "prezence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.7",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",  # lets FastAPI read HTML form posts
  "supabase>=2.5",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
